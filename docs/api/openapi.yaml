      summary: List slots for provider
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }

  /api/slots:
    post:
      tags: [Slots]
      summary: Create provider slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSlotRequest'
      responses:
        '201': { $ref: '#/components/responses/CreatedResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
