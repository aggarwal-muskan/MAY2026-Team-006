openapi: 3.0.3
info:
  title: SocioNeed API
  version: 1.1.0
  description: |
    Unified API specification for SocioNeed backend.
    This file documents implemented endpoints, expected request/response behavior,
    standard error envelopes, and user-story mapping for milestone submission.
servers:
  - url: http://127.0.0.1:5000
    description: Local development backend
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Users
  - name: Societies
  - name: Units
  - name: Occupancies
  - name: Notices
  - name: Events
  - name: Complaints
  - name: Service Categories
  - name: Providers
  - name: Slots
  - name: Bookings
  - name: Reviews
  - name: Visitors
  - name: Analytics
  - name: Reports
paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a user account
      description: Creates a new account under a valid society and returns an access token.
      x-user-stories: [US-001, US-002]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201': { $ref: '#/components/responses/CreatedResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/ConflictError' }

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login with email or phone
      description: Authenticates a user and returns JWT token with role and society claims.
      x-user-stories: [US-003]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Logout current session
      description: Stateless logout acknowledgement for authenticated users.
      x-user-stories: [US-004]
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }

  /api/auth/verify-token:
    post:
      tags: [Auth]
      summary: Verify JWT token
      description: Validates token and returns decoded claims payload.
      x-user-stories: [US-004]
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }

  /api/auth/refresh-token:
    post:
      tags: [Auth]
      summary: Refresh access token
      description: Issues a fresh access token for currently authenticated user.
      x-user-stories: [US-004]
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /api/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Reset password using account identifier
      description: Resets password using email or phone identifier and optional phone verification.
      x-user-stories: [US-027]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /api/auth/change-password:
    post:
      tags: [Auth]
      summary: Change password for logged in user
      description: Verifies current password and updates to a new password.
      x-user-stories: [US-028]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /api/users:
    get:
      tags: [Users]
      summary: List users
      description: Returns paginated users with filtering by role/status/society and search.
      x-user-stories: [US-005]
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
    post:
      tags: [Users]
      summary: Create user
      description: Admin creates a user account with role and status.
      x-user-stories: [US-006]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201': { $ref: '#/components/responses/CreatedResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/ConflictError' }

  /api/users/me:
    get:
      tags: [Users]
      summary: Get current user profile
      x-user-stories: [US-007]
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    put:
      tags: [Users]
      summary: Update current user profile
      x-user-stories: [US-008]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }

  /api/users/{user_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: Get user by ID
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    put:
      tags: [Users]
      summary: Update user by ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    delete:
      tags: [Users]
      summary: Delete user by ID
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /api/users/{user_id}/activate:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Users]
      summary: Activate user
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /api/users/{user_id}/deactivate:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Users]
      summary: Deactivate user
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /api/societies:
    get:
      tags: [Societies]
      summary: List societies
      x-user-stories: [US-009]
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }
    post:
      tags: [Societies]
      summary: Create society
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSocietyRequest'
      responses:
        '201': { $ref: '#/components/responses/CreatedResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /api/societies/{society_id}:
    parameters:
      - $ref: '#/components/parameters/SocietyId'
    get:
      tags: [Societies]
      summary: Get society by ID
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    put:
      tags: [Societies]
      summary: Update society
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /api/units:
    get:
      tags: [Units]
      summary: List units
      x-user-stories: [US-010]
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }
    post:
      tags: [Units]
      summary: Create unit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUnitRequest'
      responses:
        '201': { $ref: '#/components/responses/CreatedResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /api/units/{unit_id}:
    parameters:
      - $ref: '#/components/parameters/UnitId'
    get:
      tags: [Units]
      summary: Get unit by ID
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    put:
      tags: [Units]
      summary: Update unit
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    delete:
      tags: [Units]
      summary: Delete unit
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /api/units/{unit_id}/residents:
    parameters:
      - $ref: '#/components/parameters/UnitId'
    get:
      tags: [Units]
      summary: List occupancy records for a unit
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }

  /api/occupancies:
    get:
      tags: [Occupancies]
      summary: List occupancies
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }
    post:
      tags: [Occupancies]
      summary: Create occupancy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOccupancyRequest'
      responses:
        '201': { $ref: '#/components/responses/CreatedResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /api/occupancies/{occupancy_id}:
    parameters:
      - $ref: '#/components/parameters/OccupancyId'
    put:
      tags: [Occupancies]
      summary: Update occupancy
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    delete:
      tags: [Occupancies]
      summary: Delete occupancy
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /api/notices:
    get:
      tags: [Notices]
      summary: List notices
      x-user-stories: [US-011]
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }
    post:
      tags: [Notices]
      summary: Create notice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNoticeRequest'
      responses:
        '201': { $ref: '#/components/responses/CreatedResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /api/notices/{notice_id}:
    parameters:
      - $ref: '#/components/parameters/NoticeId'
    get:
      tags: [Notices]
      summary: Get notice
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    put:
      tags: [Notices]
      summary: Update notice
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    delete:
      tags: [Notices]
      summary: Delete notice
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /api/notices/{notice_id}/publish:
    parameters:
      - $ref: '#/components/parameters/NoticeId'
    post:
      tags: [Notices]
      summary: Publish notice now
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }
