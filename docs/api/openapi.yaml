components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UserId: { name: user_id, in: path, required: true, schema: { type: integer } }
    SocietyId: { name: society_id, in: path, required: true, schema: { type: integer } }
    UnitId: { name: unit_id, in: path, required: true, schema: { type: integer } }
    OccupancyId: { name: occupancy_id, in: path, required: true, schema: { type: integer } }
    NoticeId: { name: notice_id, in: path, required: true, schema: { type: integer } }
    EventId: { name: event_id, in: path, required: true, schema: { type: integer } }
    ComplaintId: { name: complaint_id, in: path, required: true, schema: { type: integer } }
    CategoryId: { name: category_id, in: path, required: true, schema: { type: integer } }
    ProviderId: { name: provider_id, in: path, required: true, schema: { type: integer } }
    SlotId: { name: slot_id, in: path, required: true, schema: { type: integer } }
    BookingId: { name: booking_id, in: path, required: true, schema: { type: integer } }
    ReviewId: { name: review_id, in: path, required: true, schema: { type: integer } }
    EntryId: { name: entry_id, in: path, required: true, schema: { type: integer } }

  responses:
    OkResponse:
      description: Successful response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiSuccessEnvelope'
    CreatedResponse:
      description: Resource created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiSuccessEnvelope'
    ValidationError:
      description: Invalid or missing input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
    UnauthorizedError:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
    ForbiddenError:
      description: Access denied for role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
    ConflictError:
      description: Duplicate or conflicting state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
    UnprocessableError:
      description: Business rule constraint failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'

  schemas:
    ApiSuccessEnvelope:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Success }
        data:
          type: object
          additionalProperties: true
    ApiErrorEnvelope:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string, example: Missing required fields: email }

    RegisterRequest:
      type: object
      required: [full_name, email, password, role, society_id]
      properties:
        full_name: { type: string }
        email: { type: string }
        phone: { type: string }
        password: { type: string }
        role: { type: string, enum: [admin, owner, tenant, service_provider, security] }
        society_id: { type: integer }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, description: Email address or mobile number }
        password: { type: string }
        role: { type: string, description: Supports resident/provider aliases }

    ForgotPasswordRequest:
      type: object
      required: [email, new_password]
      properties:
        email: { type: string, description: Email or phone identifier }
        phone: { type: string, description: Optional second-factor phone check }
        new_password: { type: string }

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string }
        new_password: { type: string }

    CreateUserRequest:
      type: object
      required: [society_id, role, full_name, email, password]
      properties:
        society_id: { type: integer }
        role: { type: string }
        full_name: { type: string }
        email: { type: string }
        phone: { type: string }
        password: { type: string }
        status: { type: string }

    UpdateMeRequest:
      type: object
      properties:
        full_name: { type: string }
        phone: { type: string }

    UpdateUserRequest:
      type: object
      properties:
        full_name: { type: string }
        phone: { type: string }
        email: { type: string }
        role: { type: string }
        society_id: { type: integer }
        status: { type: string }
        password: { type: string }

    CreateSocietyRequest:
      type: object
      required: [name, address, city, pincode]
      properties:
        name: { type: string }
        address: { type: string }
        city: { type: string }
        pincode: { type: string }
        contact_email: { type: string }
        contact_phone: { type: string }

    CreateUnitRequest:
      type: object
      required: [society_id, unit_number]
      properties:
        society_id: { type: integer }
        block_name: { type: string }
        unit_number: { type: string }
        floor: { type: string }
        unit_type: { type: string }
        status: { type: string }

    CreateOccupancyRequest:
      type: object
      required: [unit_id, user_id, occupancy_type, start_date]
      properties:
        unit_id: { type: integer }
        user_id: { type: integer }
        occupancy_type: { type: string }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        is_primary: { type: boolean }

    CreateNoticeRequest:
      type: object
      required: [title, body, notice_type, priority]
      properties:
        title: { type: string }
        body: { type: string }
        notice_type: { type: string }
        priority: { type: string }
        publish_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }

    CreateEventRequest:
      type: object
      required: [title, event_date]
      properties:
        title: { type: string }
        description: { type: string }
        event_date: { type: string, format: date }
        start_time: { type: string }
        end_time: { type: string }
        venue: { type: string }
        status: { type: string }

    CreateComplaintRequest:
      type: object
      required: [subject, description, category, priority]
      properties:
        subject: { type: string }
        description: { type: string }
        category: { type: string }
        priority: { type: string }

    CreateProviderRequest:
      type: object
      required: [category_id, business_name]
      properties:
        user_id: { type: integer }
        category_id: { type: integer }
        business_name: { type: string }
        service_description: { type: string }

    CreateSlotRequest:
      type: object
      required: [provider_id, slot_start, slot_end]
      properties:
        provider_id: { type: integer }
        slot_start: { type: string, format: date-time }
        slot_end: { type: string, format: date-time }
        is_available: { type: boolean }

    CreateBookingRequest:
      type: object
      required: [provider_id]
      properties:
        provider_id: { type: integer }
        slot_id: { type: integer }
        request_notes: { type: string }

    CreateReviewRequest:
      type: object
      required: [provider_id, booking_id, rating]
      properties:
        provider_id: { type: integer }
        booking_id: { type: integer }
        rating: { type: integer, minimum: 1, maximum: 5 }
        feedback: { type: string }

    CreateVisitorRequest:
      type: object
      required: [society_id, recorded_by_user_id, visitor_name]
      properties:
        society_id: { type: integer }
        recorded_by_user_id: { type: integer }
        resident_user_id: { type: integer }
        visitor_name: { type: string }
        vehicle_number: { type: string }
        contact_number: { type: string }
        remarks: { type: string }
