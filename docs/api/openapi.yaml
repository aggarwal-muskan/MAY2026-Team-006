        '404': { $ref: '#/components/responses/NotFoundError' }
    put:
      tags: [Service Categories]
      summary: Update category
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /api/providers:
