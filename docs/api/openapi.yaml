  /api/events/{event_id}:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Events]
      summary: Get event details
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    put:
      tags: [Events]
      summary: Update event
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    delete:
      tags: [Events]
      summary: Delete event
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /api/events/{event_id}/attendees:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Events]
      summary: List event attendee registrations
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }

  /api/events/{event_id}/register:
    parameters:
      - $ref: '#/components/parameters/EventId'
    post:
      tags: [Events]
      summary: Register for event
      x-user-stories: [US-013]
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }

  /api/events/{event_id}/unregister:
    parameters:
      - $ref: '#/components/parameters/EventId'
    post:
      tags: [Events]
      summary: Unregister from event
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /api/events/{event_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/EventId'
    put:
      tags: [Events]
      summary: Cancel event
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /api/complaints:
    get:
      tags: [Complaints]
      summary: List complaints
      x-user-stories: [US-014]
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }
    post:
      tags: [Complaints]
      summary: Raise complaint
      x-user-stories: [US-015]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateComplaintRequest'
      responses:
        '201': { $ref: '#/components/responses/CreatedResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /api/complaints/{complaint_id}:
    parameters:
      - $ref: '#/components/parameters/ComplaintId'
    get:
      tags: [Complaints]
      summary: Get complaint details with update timeline
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    put:
      tags: [Complaints]
      summary: Update complaint
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    delete:
      tags: [Complaints]
      summary: Delete complaint
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /api/complaints/{complaint_id}/assign:
    parameters:
      - $ref: '#/components/parameters/ComplaintId'
    put:
      tags: [Complaints]
      summary: Assign complaint to a user
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /api/complaints/{complaint_id}/status:
    parameters:
      - $ref: '#/components/parameters/ComplaintId'
    put:
      tags: [Complaints]
      summary: Change complaint status
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /api/complaints/{complaint_id}/updates:
