  /api/events:
    get:
      tags: [Events]
      summary: List events
      x-user-stories: [US-012]
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }
    post:
      tags: [Events]
      summary: Create event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
      responses:
        '201': { $ref: '#/components/responses/CreatedResponse' }
